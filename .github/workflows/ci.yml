name: CI

on:
  push:
    branches:
      - master
      - main
      - testing
  pull_request:
  workflow_dispatch:
    inputs:
      nginx_version:
        description: "Nginx release version"
        type: string
        default: "1.30.8"
      openresty_version:
        description: "OpenResty release version"
        type: string
        default: "1.31.9.1"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    uses: ./.github/workflows/build.yml
    with:
      nginx_version: ${{ inputs.nginx_version || '1.30.8' }}
      openresty_version: ${{ inputs.openresty_version || '1.31.9.1' }}
